# 第五周配置文件：因子合成 + 组合管理
# 换方法只改这里的 method 字段，不改代码。

data:
  start: "2025-06-01"     # 评价/回测区间起点
  end: "2025-12-31"       # 区间终点
  symbols: 0              # 币种数（0 = 全部 2025 年初已上市的币）

compose:
  method: icir_weighted     # equal_weight / ic_weighted / icir_weighted
  lookback: 60            # 回看窗口 N 期（用过去多少期 IC 算权重）
  holdback: 2             # 时点滞后（t 时刻只用 < t-holdback 的 IC）
  allow_negative: false   # 是否允许负权重
  cap: null               # 单因子权重上限（null = 不设）
  min_factors: 2          # 有效因子数下限

portfolio:
  method: quantile_long_short   # quantile_long_short / score_weighted / inverse_vol
  long_short_frac: 0.2    # 分位多空比例（前/后 20%）
  gross: 1.0              # 总杠杆上限
  max_weight: 0.05        # 单币权重上限
  min_names: 5            # 每边最少持仓数
  dollar_neutral: true    # 美元中性
  liquidity_frac: 0.01    # 单币持仓金额 ≤ 日均成交额 × 此比例
  capital: 1000000        # 资金规模

rebalance:
  rebalance_freq: 1       # 调仓频率（每 1/3/5 天）
  buffer: 0.0             # 缓冲区（新旧权重差 < 此值不动）
  adjustment: 1.0         # 部分调整系数（1=一步到位）
